# Keep requests bounded and retry transient network failures.
max_concurrency = 3
host_concurrency = 1
max_retries = 2
retry_wait_time = 3
timeout = 30
exclude_all_private = true

# These exact pages were verified manually during the November 2026 audit.
# Their bot protection returns HTTP 403 to automated checkers. Recheck manually
# when editing these entries; do not ignore 403 responses for other links.
exclude = [
    '^https://www\.asterisk\.org/$',
    '^https://www\.asterisk\.org/astricon/$',
    '^https://www\.freepbx\.org/?$',
]
